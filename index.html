<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=600,height=600,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Ray-Ban YouTube Search</title>

  <style>
    :root {
      color-scheme: dark;
      --accent: #36f5c5;
      --accent-soft: #17342d;
      --panel: #101716;
      --line: #52625e;
      --muted: #a8b3b0;
      --danger: #ff9292;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 600px;
      height: 600px;
      margin: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body { padding: 22px; }

    h1,
    h2,
    p { margin: 0; }

    h1 {
      font-size: 31px;
      line-height: 1.15;
    }

    h2 {
      overflow: hidden;
      font-size: 21px;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    p {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.4;
    }

    .screen {
      width: 100%;
      height: 100%;
    }

    .hidden { display: none !important; }

    .card {
      margin-top: 20px;
      padding: 18px;
      border: 2px solid #273431;
      border-radius: 18px;
      background: rgba(13, 20, 18, 0.96);
    }

    input,
    button {
      border: 3px solid var(--line);
      border-radius: 14px;
      background: #111;
      color: #fff;
      font: inherit;
      font-size: 18px;
    }

    input {
      width: 100%;
      min-width: 0;
      min-height: 62px;
      padding: 0 15px;
    }

    button {
      min-height: 56px;
      padding: 9px 13px;
      font-weight: 700;
    }

    input:focus,
    button:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: 0 0 0 3px rgba(54, 245, 197, 0.18);
    }

    button[disabled] {
      opacity: 0.42;
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr 108px;
      gap: 12px;
      margin-top: 14px;
    }

    .home-actions,
    .player-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
    }

    .tip,
    .status {
      border-radius: 11px;
      background: var(--panel);
      font-size: 15px;
      line-height: 1.4;
    }

    .tip {
      margin-top: 18px;
      padding: 14px;
      color: var(--muted);
    }

    .status {
      min-height: 43px;
      margin-top: 13px;
      padding: 10px 12px;
      color: var(--accent);
    }

    .status.error { color: var(--danger); }

    .header-row {
      display: grid;
      grid-template-columns: 94px 1fr;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .header-row button,
    .player-header button {
      min-height: 50px;
      padding: 5px;
      font-size: 16px;
    }

    .result-list,
    .history-list {
      display: grid;
      gap: 9px;
      max-height: 468px;
      overflow: hidden;
    }

    .result-item,
    .history-item {
      display: grid;
      align-items: center;
      width: 100%;
      min-height: 78px;
      padding: 8px;
      text-align: left;
    }

    .result-item {
      grid-template-columns: 106px 1fr;
      gap: 12px;
    }

    .history-item {
      grid-template-columns: 48px 1fr;
      gap: 10px;
    }

    .thumbnail {
      width: 100px;
      height: 56px;
      border-radius: 8px;
      object-fit: cover;
      background: #222;
    }

    .result-copy,
    .history-copy {
      min-width: 0;
    }

    .result-title,
    .history-title {
      display: -webkit-box;
      overflow: hidden;
      font-size: 16px;
      font-weight: 750;
      line-height: 1.25;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .channel {
      overflow: hidden;
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .number {
      color: var(--accent);
      font-size: 21px;
      text-align: center;
    }

    .player-header {
      display: grid;
      grid-template-columns: 78px 1fr 78px;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    #playing-title {
      overflow: hidden;
      font-size: 16px;
      font-weight: 750;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #player-shell {
      position: relative;
      width: 556px;
      height: 313px;
      overflow: hidden;
      border: 2px solid #35433f;
      border-radius: 16px;
      background: #080808;
    }

    #player,
    #player iframe {
      width: 100% !important;
      height: 100% !important;
      border: 0;
    }

    #player iframe {
      pointer-events: none;
    }

    .player-actions button {
      min-height: 55px;
      font-size: 17px;
    }

    .empty {
      margin-top: 28px;
      padding: 24px;
      border: 2px dashed #33403e;
      border-radius: 16px;
      text-align: center;
    }
  </style>
</head>

<body>
  <main id="search-screen" class="screen">
    <h1>YouTube Search</h1>
    <p>검색어를 입력하고 영상을 선택하세요.</p>

    <section class="card">
      <label for="search-input">검색어</label>

      <div class="search-row">
        <input
          id="search-input"
          data-nav
          data-label="검색어 입력"
          type="search"
          autocomplete="off"
          placeholder="예: 민화 다큐멘터리"
          tabindex="0"
        >

        <button
          id="search-button"
          data-nav
          data-label="검색"
          type="button"
          tabindex="0"
        >
          검색
        </button>
      </div>

      <div class="home-actions">
        <button
          id="player-test-button"
          data-nav
          data-label="플레이어 테스트"
          type="button"
          tabindex="0"
        >
          플레이어 테스트
        </button>

        <button
          id="history-button"
          data-nav
          data-label="최근 재생"
          type="button"
          tabindex="0"
        >
          최근 재생
        </button>
      </div>
    </section>

    <div class="tip">
      검색에는 YouTube Data API 키가 필요합니다.<br>
      코드 상단의 <strong>YOUR_YOUTUBE_API_KEY</strong>를 교체하세요.
    </div>

    <div id="search-status" class="status">검색어를 입력하세요.</div>
  </main>

  <main id="results-screen" class="screen hidden">
    <div class="header-row">
      <button id="results-back" data-nav data-label="검색으로 돌아가기" type="button" tabindex="0">
        뒤로
      </button>
      <h2 id="results-heading">검색 결과</h2>
    </div>

    <div id="results-list" class="result-list"></div>
    <div id="results-status" class="status">검색 결과를 선택하세요.</div>
  </main>

  <main id="player-screen" class="screen hidden">
    <div class="player-header">
      <button id="player-back" data-nav data-label="이전 화면" type="button" tabindex="0">뒤로</button>
      <div id="playing-title">영상 준비 중</div>
      <button id="player-home" data-nav data-label="검색 화면" type="button" tabindex="0">검색</button>
    </div>

    <div id="player-shell">
      <div id="player"></div>
    </div>

    <div class="player-actions">
      <button id="previous-button" data-nav data-label="이전 영상" type="button" tabindex="0">이전</button>
      <button id="play-button" data-nav data-label="재생 또는 일시정지" type="button" tabindex="0">재생</button>
      <button id="next-button" data-nav data-label="다음 영상" type="button" tabindex="0">다음</button>
      <button id="restart-button" data-nav data-label="처음부터 재생" type="button" tabindex="0">처음부터</button>
    </div>

    <div id="player-status" class="status">YouTube 플레이어를 불러오는 중입니다.</div>
  </main>

  <main id="history-screen" class="screen hidden">
    <div class="header-row">
      <button id="history-back" data-nav data-label="검색으로 돌아가기" type="button" tabindex="0">
        뒤로
      </button>
      <h2>최근 재생</h2>
    </div>

    <div id="history-list" class="history-list"></div>
    <div id="history-status" class="status">최근 재생 영상을 선택하세요.</div>
  </main>

  <script>
    /*
     * 1. Google Cloud Console에서 YouTube Data API v3를 활성화합니다.
     * 2. 아래 문자열만 자신의 API 키로 교체합니다.
     * 3. 공개 배포용으로는 API 키를 서버 환경변수로 옮겨야 합니다.
     */
    const YOUTUBE_API_KEY = "AIzaSyA_ullHqB_lwcEAjBm-Ap4j_zPTp73V21E";

    const SAMPLE_VIDEO = {
      id: "M7lc1UVf-VE",
      title: "YouTube IFrame Player API Demo",
      channel: "YouTube Developers",
      thumbnail: "https://i.ytimg.com/vi/M7lc1UVf-VE/mqdefault.jpg"
    };

    const HISTORY_KEY = "rayban-youtube-history-v2";
    const MAX_RESULTS = 5;
    const MAX_HISTORY = 5;

    const screens = {
      search: document.getElementById("search-screen"),
      results: document.getElementById("results-screen"),
      player: document.getElementById("player-screen"),
      history: document.getElementById("history-screen")
    };

    const searchInput = document.getElementById("search-input");
    const searchStatus = document.getElementById("search-status");
    const resultsHeading = document.getElementById("results-heading");
    const resultsList = document.getElementById("results-list");
    const resultsStatus = document.getElementById("results-status");
    const playingTitle = document.getElementById("playing-title");
    const playerStatus = document.getElementById("player-status");
    const playButton = document.getElementById("play-button");
    const historyList = document.getElementById("history-list");
    const historyStatus = document.getElementById("history-status");

    let currentScreen = "search";
    let playerReturnScreen = "results";
    let currentFocusIndex = 0;
    let searchResults = [];
    let currentResultIndex = -1;
    let currentVideo = null;
    let player = null;
    let playerReady = false;
    let pendingVideoId = SAMPLE_VIDEO.id;
    let recentVideos = loadHistory();

    function loadHistory() {
      try {
        const value = JSON.parse(localStorage.getItem(HISTORY_KEY));
        return Array.isArray(value) ? value.filter(isVideoObject).slice(0, MAX_HISTORY) : [];
      } catch (error) {
        return [];
      }
    }

    function saveHistory() {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(recentVideos));
    }

    function isVideoObject(video) {
      return Boolean(video && /^[A-Za-z0-9_-]{11}$/.test(video.id));
    }

    function decodeText(value) {
      const textarea = document.createElement("textarea");
      textarea.innerHTML = value || "";
      return textarea.value;
    }

    function setStatus(element, message, isError = false) {
      element.textContent = message;
      element.classList.toggle("error", isError);
    }

    function visibleNavigationItems() {
      return Array.from(
        screens[currentScreen].querySelectorAll("[data-nav]:not([disabled])")
      ).filter((element) => element.offsetParent !== null);
    }

    function focusItem(index) {
      const items = visibleNavigationItems();
      if (!items.length) return;

      currentFocusIndex = (index + items.length) % items.length;
      items[currentFocusIndex].focus();
    }

    function syncFocusIndex() {
      const index = visibleNavigationItems().indexOf(document.activeElement);
      if (index >= 0) currentFocusIndex = index;
    }

    function showScreen(name, focusIndex = 0) {
      Object.entries(screens).forEach(([key, screen]) => {
        screen.classList.toggle("hidden", key !== name);
      });

      currentScreen = name;

      if (name === "history") renderHistory();
      setTimeout(() => focusItem(focusIndex), 60);
    }

    function hasConfiguredApiKey() {
      return YOUTUBE_API_KEY && YOUTUBE_API_KEY !== "YOUR_YOUTUBE_API_KEY";
    }

    async function searchYouTube() {
      const query = searchInput.value.trim();

      if (!query) {
        setStatus(searchStatus, "검색어를 먼저 입력하세요.", true);
        return;
      }

      if (!hasConfiguredApiKey()) {
        setStatus(searchStatus, "코드의 YOUR_YOUTUBE_API_KEY를 실제 API 키로 교체하세요.", true);
        return;
      }

      setStatus(searchStatus, "YouTube에서 검색 중입니다.");
      document.getElementById("search-button").disabled = true;

      const parameters = new URLSearchParams({
        part: "snippet",
        type: "video",
        maxResults: String(MAX_RESULTS),
        safeSearch: "moderate",
        relevanceLanguage: "ko",
        q: query,
        key: YOUTUBE_API_KEY,
        fields: "items(id/videoId,snippet/title,snippet/channelTitle,snippet/thumbnails/medium/url)"
      });

      try {
        const response = await fetch(
          "https://www.googleapis.com/youtube/v3/search?" + parameters.toString(),
          { method: "GET", mode: "cors", cache: "no-store" }
        );

        const data = await response.json();

        if (!response.ok) {
          const reason = data?.error?.errors?.[0]?.reason;
          const message = {
            keyInvalid: "API 키가 올바르지 않습니다.",
            quotaExceeded: "오늘 사용할 수 있는 YouTube 검색량을 초과했습니다.",
            dailyLimitExceeded: "오늘 사용할 수 있는 YouTube 검색량을 초과했습니다.",
            accessNotConfigured: "Google Cloud에서 YouTube Data API v3를 활성화하세요."
          }[reason] || data?.error?.message || "YouTube 검색 요청에 실패했습니다.";

          throw new Error(message);
        }

        searchResults = (data.items || []).map((item) => ({
          id: item.id.videoId,
          title: decodeText(item.snippet.title),
          channel: decodeText(item.snippet.channelTitle),
          thumbnail:
            item.snippet.thumbnails?.medium?.url ||
            "https://i.ytimg.com/vi/" + item.id.videoId + "/mqdefault.jpg"
        })).filter(isVideoObject);

        currentResultIndex = -1;
        renderResults(query);
        showScreen("results", 0);
      } catch (error) {
        setStatus(searchStatus, error.message || "검색 중 오류가 발생했습니다.", true);
      } finally {
        document.getElementById("search-button").disabled = false;
      }
    }

    function renderResults(query) {
      resultsHeading.textContent = "검색 · " + query;
      resultsList.replaceChildren();

      if (!searchResults.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "검색 결과가 없습니다.";
        resultsList.appendChild(empty);
        setStatus(resultsStatus, "다른 검색어를 입력해보세요.");
        return;
      }

      searchResults.forEach((video, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "result-item";
        button.dataset.nav = "";
        button.dataset.label = "검색 결과 " + (index + 1);
        button.tabIndex = 0;

        const image = document.createElement("img");
        image.className = "thumbnail";
        image.src = video.thumbnail;
        image.alt = "";

        const copy = document.createElement("span");
        copy.className = "result-copy";

        const title = document.createElement("span");
        title.className = "result-title";
        title.textContent = video.title;

        const channel = document.createElement("span");
        channel.className = "channel";
        channel.textContent = video.channel;

        copy.append(title, channel);
        button.append(image, copy);
        button.addEventListener("click", () => openVideo(video, index, "results"));
        resultsList.appendChild(button);
      });

      setStatus(resultsStatus, searchResults.length + "개의 결과가 있습니다.");
    }

    function addToHistory(video) {
      recentVideos = [
        video,
        ...recentVideos.filter((item) => item.id !== video.id)
      ].slice(0, MAX_HISTORY);
      saveHistory();
    }

    function renderHistory() {
      historyList.replaceChildren();

      if (!recentVideos.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "최근 재생 영상이 없습니다.";
        historyList.appendChild(empty);
        setStatus(historyStatus, "검색 화면에서 영상을 선택하세요.");
        return;
      }

      recentVideos.forEach((video, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "history-item";
        button.dataset.nav = "";
        button.dataset.label = "최근 영상 " + (index + 1);
        button.tabIndex = 0;

        const number = document.createElement("span");
        number.className = "number";
        number.textContent = String(index + 1);

        const copy = document.createElement("span");
        copy.className = "history-copy";

        const title = document.createElement("span");
        title.className = "history-title";
        title.textContent = video.title;

        const channel = document.createElement("span");
        channel.className = "channel";
        channel.textContent = video.channel || video.id;

        copy.append(title, channel);
        button.append(number, copy);
        button.addEventListener("click", () => openVideo(video, -1, "history"));
        historyList.appendChild(button);
      });

      setStatus(historyStatus, recentVideos.length + "개의 최근 영상이 있습니다.");
    }

    function openVideo(video, resultIndex = -1, returnScreen = "results") {
      if (!isVideoObject(video)) return;

      currentVideo = video;
      currentResultIndex = resultIndex;
      playerReturnScreen = returnScreen;
      pendingVideoId = video.id;
      playingTitle.textContent = video.title;
      addToHistory(video);
      showScreen("player", 0);

      if (playerReady && player) {
        player.cueVideoById(video.id);
        setStatus(playerStatus, "영상이 준비되었습니다. 재생을 선택하세요.");
      } else {
        setStatus(playerStatus, "YouTube 플레이어를 불러오는 중입니다.");
      }
    }

    function adjacentVideo(direction) {
      if (!searchResults.length || currentResultIndex < 0) {
        setStatus(playerStatus, "이전·다음 기능은 검색 결과에서 영상을 선택했을 때 사용할 수 있습니다.", true);
        return;
      }

      currentResultIndex =
        (currentResultIndex + direction + searchResults.length) % searchResults.length;

      openVideo(searchResults[currentResultIndex], currentResultIndex, "results");
    }

    function togglePlayback() {
      if (!playerReady || !player || !window.YT) {
        setStatus(playerStatus, "플레이어가 아직 준비되지 않았습니다.", true);
        return;
      }

      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    }

    function restartVideo() {
      if (!playerReady || !player) return;
      player.seekTo(0, true);
      player.playVideo();
    }

    function goBackInsideApp() {
      if (currentScreen === "player") {
        showScreen(playerReturnScreen, 0);
      } else if (currentScreen === "results" || currentScreen === "history") {
        showScreen("search", 0);
      }
    }

    function activateFocusedElement() {
      const active = document.activeElement;
      if (!active || !active.matches("[data-nav]")) return;
      if (active.tagName === "INPUT") return;
      active.click();
    }

    document.addEventListener("focusin", syncFocusIndex);

    window.addEventListener("keydown", (event) => {
      const active = document.activeElement;
      const isInput = active && active.tagName === "INPUT";

      if (event.key === "Enter") {
        if (isInput) return;
        event.preventDefault();
        event.stopPropagation();
        activateFocusedElement();
        return;
      }

      if (event.key === "Escape") {
        event.preventDefault();
        event.stopPropagation();
        goBackInsideApp();
        return;
      }

      if (isInput) return;

      if (event.key === "ArrowDown" || event.key === "ArrowRight") {
        event.preventDefault();
        event.stopPropagation();
        focusItem(currentFocusIndex + 1);
      }

      if (event.key === "ArrowUp" || event.key === "ArrowLeft") {
        event.preventDefault();
        event.stopPropagation();
        focusItem(currentFocusIndex - 1);
      }
    }, true);

    searchInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && searchInput.value.trim()) {
        event.preventDefault();
        searchYouTube();
      }
    });

    document.getElementById("search-button").addEventListener("click", searchYouTube);
    document.getElementById("player-test-button").addEventListener("click", () => {
      openVideo(SAMPLE_VIDEO, -1, "search");
    });
    document.getElementById("history-button").addEventListener("click", () => showScreen("history", 0));
    document.getElementById("results-back").addEventListener("click", () => showScreen("search", 0));
    document.getElementById("history-back").addEventListener("click", () => showScreen("search", 0));
    document.getElementById("player-back").addEventListener("click", goBackInsideApp);
    document.getElementById("player-home").addEventListener("click", () => showScreen("search", 0));
    document.getElementById("previous-button").addEventListener("click", () => adjacentVideo(-1));
    document.getElementById("next-button").addEventListener("click", () => adjacentVideo(1));
    playButton.addEventListener("click", togglePlayback);
    document.getElementById("restart-button").addEventListener("click", restartVideo);

    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player("player", {
        width: 556,
        height: 313,
        videoId: SAMPLE_VIDEO.id,
        playerVars: {
          autoplay: 0,
          controls: 0,
          disablekb: 1,
          fs: 0,
          playsinline: 1,
          rel: 0,
          origin: window.location.origin
        },
        events: {
          onReady: function () {
            playerReady = true;
            player.cueVideoById(pendingVideoId);
            setStatus(playerStatus, "영상이 준비되었습니다. 재생을 선택하세요.");
          },
          onStateChange: function (event) {
            if (event.data === YT.PlayerState.PLAYING) {
              playButton.textContent = "일시정지";
              setStatus(playerStatus, "재생 중");
            } else if (event.data === YT.PlayerState.PAUSED) {
              playButton.textContent = "재생";
              setStatus(playerStatus, "일시정지됨");
            } else if (event.data === YT.PlayerState.ENDED) {
              playButton.textContent = "재생";
              setStatus(playerStatus, "재생이 끝났습니다.");
            } else if (event.data === YT.PlayerState.CUED) {
              playButton.textContent = "재생";
              setStatus(playerStatus, "영상이 준비되었습니다. 재생을 선택하세요.");
            }
          },
          onError: function (event) {
            const messages = {
              2: "영상 ID가 올바르지 않습니다.",
              5: "이 영상은 현재 플레이어에서 재생할 수 없습니다.",
              100: "삭제되었거나 비공개 영상입니다.",
              101: "영상 소유자가 외부 재생을 허용하지 않았습니다.",
              150: "영상 소유자가 외부 재생을 허용하지 않았습니다."
            };

            setStatus(
              playerStatus,
              messages[event.data] || "YouTube 재생 오류가 발생했습니다.",
              true
            );
          }
        }
      });
    };

    const youtubePlayerApi = document.createElement("script");
    youtubePlayerApi.src = "https://www.youtube.com/iframe_api";
    youtubePlayerApi.async = true;
    youtubePlayerApi.onerror = function () {
      setStatus(playerStatus, "YouTube 플레이어 API를 불러오지 못했습니다.", true);
      setStatus(searchStatus, "이 글래스 환경에서 YouTube 플레이어가 차단될 수 있습니다.", true);
    };
    document.head.appendChild(youtubePlayerApi);

    window.addEventListener("load", () => {
      if (!hasConfiguredApiKey()) {
        setStatus(searchStatus, "API 키를 설정하면 검색을 사용할 수 있습니다.");
      }
      setTimeout(() => focusItem(0), 300);
    });
  </script>
</body>
</html>
